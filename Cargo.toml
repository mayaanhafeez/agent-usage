[package]
name = "agent-usage"
version = "0.1.0"
edition = "2024"
description = "A focused usage TUI for terminal coding agents"
license = "MIT"
authors = ["Ayaan Hafeez"]
repository = "https://github.com/mayaanhafeez/agent-usage"
homepage = "https://github.com/mayaanhafeez/agent-usage"
readme = "README.md"
rust-version = "1.85"
keywords = ["cli", "tui", "ai", "agents", "usage"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
dirs = "6.0"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1.0"
sysinfo = "0.37"
walkdir = "2.5"

[profile.release]
lto = "thin"
strip = true
